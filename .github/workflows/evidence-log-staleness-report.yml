name: Evidence log staleness report

on:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Report entries with a last_verified date over 12 months old
        run: python3 data/evidence/report_stale.py
